name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          hide_month_labels: "false"

      - name: Preserve Pac-Man assets
        shell: bash
        run: |
          set -e
          mkdir -p pacman-output
          cp dist/pacman-contribution-graph.svg pacman-output/
          cp dist/pacman-contribution-graph-dark.svg pacman-output/

      - name: Generate contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2310B981&color_dots=%23E5E7EB,%23D1FAE5,%23A7F3D0,%2334D399,%2310B981
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA

      - name: Restore Pac-Man assets
        shell: bash
        run: |
          set -e
          cp pacman-output/pacman-contribution-graph.svg dist/
          cp pacman-output/pacman-contribution-graph-dark.svg dist/

      - name: Publish all contribution animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
